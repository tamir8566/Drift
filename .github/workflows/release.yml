name: Build & release Drift

on:
  push:
    branches: [main]
    # A push that only touches documentation is not a new version of the app: nothing is built
    # and no update is offered to the phones. (Any other file in the same push builds as usual.)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ------------------------------------------------------------------
      # Signing: decode the keystore from the secret into a temp file.
      # This workflow publishes to the phones, so it never continues without
      # the release key: an APK signed with the debug key (the local fallback
      # in app/build.gradle.kts) would be offered as an update and then refuse
      # to install over the installed app.
      # ------------------------------------------------------------------
      - name: Decode signing keystore
        id: keystore
        env:
          DRIFT_KEYSTORE_B64: ${{ secrets.DRIFT_KEYSTORE_B64 }}
          DRIFT_KEYSTORE_PASSWORD: ${{ secrets.DRIFT_KEYSTORE_PASSWORD }}
          DRIFT_KEY_ALIAS: ${{ secrets.DRIFT_KEY_ALIAS }}
          DRIFT_KEY_PASSWORD: ${{ secrets.DRIFT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DRIFT_KEYSTORE_B64:-}" ] || [ -z "${DRIFT_KEYSTORE_PASSWORD:-}" ] || [ -z "${DRIFT_KEY_ALIAS:-}" ] || [ -z "${DRIFT_KEY_PASSWORD:-}" ]; then
            echo "::error::A signing secret is missing (DRIFT_KEYSTORE_B64 / DRIFT_KEYSTORE_PASSWORD / DRIFT_KEY_ALIAS / DRIFT_KEY_PASSWORD). Nothing is published without the release key."
            exit 1
          fi
          KS="$RUNNER_TEMP/drift-release.jks"
          echo "$DRIFT_KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > "$KS"
          if [ ! -s "$KS" ]; then
            echo "::error::Failed to decode DRIFT_KEYSTORE_B64 (empty result). Re-create it with: base64 -w0 drift-release.jks"
            exit 1
          fi
          echo "path=$KS" >> "$GITHUB_OUTPUT"
          echo "Keystore decoded ($(stat -c%s "$KS") bytes)"

      - name: Unit tests + release APK
        env:
          DRIFT_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          DRIFT_KEYSTORE_PASSWORD: ${{ secrets.DRIFT_KEYSTORE_PASSWORD }}
          DRIFT_KEY_ALIAS: ${{ secrets.DRIFT_KEY_ALIAS }}
          DRIFT_KEY_PASSWORD: ${{ secrets.DRIFT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test assembleRelease -PversionCode=${VERSION_CODE} --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          cp "$APK" "drift-${VERSION_CODE}.apk"
          cp "$APK" "drift-latest.apk"
          echo "path=drift-${VERSION_CODE}.apk" >> "$GITHUB_OUTPUT"
          ls -la drift-*.apk
          # Last line of defence: an APK signed with the debug key is never published.
          APKSIGNER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/35.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            CERT=$("$APKSIGNER" verify --print-certs "drift-${VERSION_CODE}.apk" | grep "certificate DN" || true)
            echo "$CERT"
            if echo "$CERT" | grep -qi "Android Debug"; then
              echo "::error::The APK is signed with the debug key – not publishing it."
              exit 1
            fi
          fi

      # ------------------------------------------------------------------
      # Supabase Storage: create the public bucket if missing, upload both
      # APK names (upsert) and overwrite manifest.json.
      # ------------------------------------------------------------------
      - name: Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BUCKET: drift-releases
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_KEY secrets are missing – cannot publish the update."
            exit 1
          fi
          SUPABASE_URL="${SUPABASE_URL%/}"
          AUTH=(-H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" -H "apikey: ${SUPABASE_SERVICE_KEY}")

          # 1) Bucket: create as public when it does not exist.
          code=$(curl -sS -o /tmp/bucket.json -w '%{http_code}' "${AUTH[@]}" "${SUPABASE_URL}/storage/v1/bucket/${BUCKET}")
          if [ "$code" = "404" ] || [ "$code" = "400" ]; then
            echo "Bucket ${BUCKET} not found (HTTP $code) – creating it as public"
            code=$(curl -sS -o /tmp/bucket-create.json -w '%{http_code}' "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${SUPABASE_URL}/storage/v1/bucket" \
              -d "{\"id\":\"${BUCKET}\",\"name\":\"${BUCKET}\",\"public\":true}")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::Creating bucket failed (HTTP $code): $(cat /tmp/bucket-create.json)"; exit 1
            fi
          elif [ "$code" != "200" ]; then
            echo "::error::Checking bucket failed (HTTP $code): $(cat /tmp/bucket.json)"; exit 1
          else
            # Make sure it is public (the app downloads without credentials).
            curl -sS -o /dev/null "${AUTH[@]}" -H "Content-Type: application/json" -X PUT \
              "${SUPABASE_URL}/storage/v1/bucket/${BUCKET}" -d '{"public":true}' || true
          fi

          upload() { # upload <local file> <object name> <content-type>
            local f="$1" name="$2" ct="$3"
            local code
            code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' "${AUTH[@]}" \
              -H "Content-Type: ${ct}" -H "x-upsert: true" -H "Cache-Control: no-cache" \
              -X POST "${SUPABASE_URL}/storage/v1/object/${BUCKET}/${name}" --data-binary "@${f}")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::Upload of ${name} failed (HTTP $code): $(cat /tmp/upload.json)"; exit 1
            fi
            echo "Uploaded ${name} (HTTP $code)"
          }

          # 2) APKs
          upload "drift-${VERSION_CODE}.apk" "drift-${VERSION_CODE}.apk" "application/vnd.android.package-archive"
          upload "drift-latest.apk" "drift-latest.apk" "application/vnd.android.package-archive"

          # 3) Manifest. Written by jq, so whatever the commit subject holds (quotes, backslashes,
          #    Hebrew) is escaped into valid JSON; the notes are cut to 200 characters.
          APK_URL="${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/drift-${VERSION_CODE}.apk"
          NOTES=$(git log -1 --pretty=%s)
          jq -n \
            --argjson versionCode "${VERSION_CODE}" \
            --arg versionName "1.0.${VERSION_CODE}" \
            --arg apkUrl "${APK_URL}" \
            --arg notes "${NOTES}" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, notes: ($notes[0:200])}' > manifest.json
          cat manifest.json
          jq -e '.versionCode > 0 and (.apkUrl | length) > 0' manifest.json > /dev/null
          upload "manifest.json" "manifest.json" "application/json"

          # 4) Verify the public manifest is reachable.
          code=$(curl -sS -o /tmp/manifest-check.json -w '%{http_code}' "${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/manifest.json?t=$(date +%s)")
          if [ "$code" != "200" ]; then
            echo "::error::Public manifest not reachable (HTTP $code). Is the bucket public?"; exit 1
          fi
          echo "Public manifest OK: $(cat /tmp/manifest-check.json)"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_CODE }}
          name: Drift v${{ env.VERSION_CODE }}
          body: |
            versionCode ${{ env.VERSION_CODE }} · ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: |
            drift-${{ env.VERSION_CODE }}.apk
            manifest.json
